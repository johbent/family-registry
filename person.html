
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>السجل المدني 2005 - بيانات السكان</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f1f5f9;
      color: #172b4d;
    }

    header {
      background: #123765;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .container {
      max-width: 1250px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .panel {
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 19px;
      border-bottom: 2px solid #dbe7f4;
      padding-bottom: 12px;
      margin-top: 0;
    }

    .search {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
      flex: 1;
      min-width: 180px;
    }

    button {
      background: #1764a5;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 12px 25px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #104d82;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .info-item {
      background: #f8fafc;
      padding: 12px;
      border-radius: 7px;
      overflow-wrap: anywhere;
    }

    .info-item strong {
      display: block;
      margin-bottom: 7px;
      color: #52657c;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th {
      background: #e7eff8;
      padding: 12px;
      text-align: right;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    tr:hover td {
      background: #f8fafc;
    }

    .status {
      margin-top: 12px;
      min-height: 22px;
    }

    .empty {
      padding: 15px;
      color: #64748b;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 700px) {
      .info-grid {
        grid-template-columns: 1fr;
      }

      .search {
        flex-direction: column;
      }
    }
  </style>

  <script src="/person.js" defer></script>
</head>

<body>

  <header>
    <h1>منظومة السجل المدني 2005</h1>
    <div>دليل السكان والعائلات - نسخة الويب</div>
  </header>

  <main class="container">

    <section class="panel">
      <h2>البحث عن شخص</h2>

      <form class="search" id="searchForm">
        <input
          id="identity"
          type="text"
          inputmode="numeric"
          maxlength="9"
          pattern="[0-9]{9}"
          placeholder="أدخل رقم الهوية"
          autocomplete="off"
          required
        >

        <button id="searchBtn" type="submit">
          بحث عن الشخص
        </button>
      </form>

      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      ></div>
    </section>

    <div id="results" class="hidden">

      <section class="panel">
        <h2>البيانات الشخصية</h2>
        <div id="personInfo" class="info-grid"></div>
      </section>

      <section class="panel">
        <h2>الأبناء</h2>
        <div id="children"></div>
      </section>

      <section class="panel">
        <h2>الإخوة</h2>
        <div id="siblings"></div>
      </section>

    </div>

  </main>

</body>
</html>
